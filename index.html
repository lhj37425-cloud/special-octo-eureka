<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EVOL DREAM 企业 AI 应用与人才培养" />
    <title>EVOL DREAM｜企业AI应用与人才培养</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      /* Keep the existing portrait format; use the available right side for all profile text. */
      .teacher-grid { grid-template-columns: 1fr; gap: 22px; }
      .teacher { padding: 28px; }
      .teacher-card-layout { grid-template-columns: 180px minmax(0, 1fr); gap: 30px; }
      .teacher-portrait { width: 180px; height: 238px; object-fit: contain; object-position: center; background: #f1eeee; }
      .teacher-copy { padding-right: 12px; }
      .teacher-copy .teacher-top { display: none; }
      .teacher-copy h3 { font-size: 30px; }
      .teacher-copy > p { font-size: 15px; line-height: 1.9; }
      .teacher-copy .tags { margin-top: 15px; }
      .teacher-linked { margin-top: 14px !important; font-size: 13px !important; }
      .teacher-copy .text-link { margin-top: 16px; font-size: 14px; }
      .teacher-profile { width: min(1280px, calc(100% - 112px)); margin: 0 auto; padding: 62px 0; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 54px; align-items: start; }
      .teacher-profile-photo { display: block; width: 220px; height: 290px; object-fit: contain; object-position: center; background: #f1eeee; }
      .teacher-profile .text-link { display: inline-block; margin-top: 30px; }
      @media (max-width: 700px) { .teacher { padding: 22px; } .teacher-card-layout { grid-template-columns: 105px minmax(0, 1fr); gap: 18px; } .teacher-portrait { width: 105px; height: 145px; } .teacher-copy h3 { font-size: 23px; } .teacher-copy > p { font-size: 13px; line-height: 1.75; } .teacher-profile { width: calc(100% - 40px); padding: 38px 0; grid-template-columns: 1fr; gap: 26px; } .teacher-profile-photo { width: 160px; height: 215px; } }
      /* About page follows the original two-block composition. */
      .page-head:has(+ .section .about-split) { background: #f6f3f2; padding-top: 48px; padding-bottom: 82px; }
      .page-head:has(+ .section .about-split) .breadcrumb { margin-bottom: 46px; }
      .about-split { display: grid !important; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important; align-items: center; gap: 76px; }
      .about-split .about-photo { min-height: 442px; background-image: url('./assets/about-workshop.webp') !important; background-position: center !important; background-size: cover !important; }
      .about-split .prose h2 { font-size: 31px; }
      @media (max-width: 700px) { .page-head:has(+ .section .about-split) { padding-top: 30px; padding-bottom: 44px; } .about-split { grid-template-columns: 1fr !important; gap: 28px; } .about-split .about-photo { min-height: 260px; } }
      /* Application scenarios: three independent image cards, matching the reference composition. */
      .scenario-image { background-image: url('./assets/scenarios.webp') !important; background-size: 300% auto !important; aspect-ratio: 1.78 !important; }
      .scenario-0 { background-position: 0 center !important; }
      .scenario-1 { background-position: 50% center !important; }
      .scenario-2 { background-position: 100% center !important; }
      .scenario-card { display: flex !important; flex-direction: column; min-height: 0; }
      .scenario-content { flex: 1; padding: 26px 30px 28px !important; }
      .scenario-content h3 { margin: 0 0 10px; }
      .scenario-content .text-link { margin-top: 23px !important; }
      /* Keep the consent checkbox and its label together on one line. */
      .contact-form .form-bottom { display: flex !important; align-items: center !important; justify-content: space-between; gap: 22px; }
      .contact-form .consent { display: block !important; flex: 1 1 auto; min-width: 0; margin: 0; line-height: 1.6; white-space: nowrap; }
      .contact-form .consent input[type="checkbox"] { display: inline-block; width: 18px; height: 18px; margin: 0 9px 0 0; vertical-align: -4px; }
      .contact-form .consent a { color: #94070a !important; text-decoration: underline; text-underline-offset: 2px; }
      @media (max-width: 700px) { .scenario-content { padding: 22px !important; } .contact-form .form-bottom { align-items: flex-start !important; flex-direction: column; } .contact-form .consent { white-space: normal; } }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">跳至主要内容</a>
    <div id="app"></div>
    <script src="./app.js"></script>
  </body>
</html>
