# EVOL DREAM 上线反代配置（Nginx）
# 放到 /etc/nginx/conf.d/evol.conf，改掉证书路径与域名后 `nginx -t && systemctl reload nginx`
#
# 拓扑：前台 4173、后台 4181 都只监听 127.0.0.1，由本机 Nginx 对外。
# 后台挂在同域 /admin/ 下（不是独立子域）：预览页要复用前台模板与静态资源，
# 而且预览鉴权用的是后台 Cookie，跨子域时带不过去会直接 401。

# 公开联系表单走前台，其余 /api/ 走后台
map $request_method $leads_upstream {
    default 127.0.0.1:4181;
    POST    127.0.0.1:4173;
}

server {
    listen 80;
    # 若目标主机内核禁用了 IPv6（少见），删掉两行 listen [::]，否则 Nginx 无法启动
    listen [::]:80;
    server_name evoldream.tech www.evoldream.tech;
    return 301 https://www.evoldream.tech$request_uri;
}

server {
    # http2 写在 listen 上：新老版本 Nginx 都认识（独立的 "http2 on;" 指令需要 ≥1.25.1，
    # 而 Ubuntu/Debian 默认源版本更旧，写了会让 nginx -t 直接失败）
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name evoldream.tech www.evoldream.tech;

    ssl_certificate     /etc/letsencrypt/live/www.evoldream.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.evoldream.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 60m;          # 后台视频上限 50MB，留余量
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 交给上游的请求头：Host 必须保留，前台表单的 Origin 校验依赖它；
    # X-Real-IP / X-Forwarded-* 供 server.js、后台服务器.js 取真实访客 IP 与 HTTPS 判断
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # ---------- 后台（同域路径） ----------
    location = /admin { return 301 /admin/; }
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:4181/;
        proxy_request_buffering off;   # 视频边收边写，不在 Nginx 落盘
        proxy_read_timeout 300s;
    }
    # 后台页面里用的是绝对路径，这几个文件必须一起指到 4181
    location = /demo.css  { proxy_pass http://127.0.0.1:4181; }
    location = /demo.js   { proxy_pass http://127.0.0.1:4181; }
    location = /store.js  { proxy_pass http://127.0.0.1:4181; }
    location = /media.js  { proxy_pass http://127.0.0.1:4181; }
    location = /editor.js { proxy_pass http://127.0.0.1:4181; }
    # 后台登录后才能看的原始素材
    location ^~ /media/   { proxy_pass http://127.0.0.1:4181; }

    # ---------- 接口 ----------
    location = /api/leads { proxy_pass http://$leads_upstream; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4181;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # ---------- 前台 ----------
    # 已发布内容的图片/视频：文件名是随机 UUID，内容一变就换名，可长缓存
    location ~* ^/admin-media/ { proxy_pass http://127.0.0.1:4173; expires 30d; }
    location ~* ^/(_astro|assets|fonts|brand)/ { proxy_pass http://127.0.0.1:4173; expires 7d; }
    # 根级改版资源（/v2*.css|js 等无目录前缀、文件名不带哈希）：禁止启发式缓存，
    # 每次回源取最新，避免改版上线后旧样式配新页面
    location ~* \.(css|js|svg)$ {
        proxy_pass http://127.0.0.1:4173;
        add_header Cache-Control "no-cache" always;
    }

    # 其余全部走前台：/、/zh/、/vi/、/en/、/preview/、/preview-media/（预览需要后台 Cookie）
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_read_timeout 120s;
    }
}
