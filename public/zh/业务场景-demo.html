<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>业务场景模块 Demo | EVOL DREAM</title>
  <style>
    :root{--ink:#10212c;--panel:#1c2c38;--cyan:#75d8fc;--paper:#f5f1e9;--mist:#dbe4e8;--red:#a61d29;--muted:#aebec8}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei",Arial,sans-serif}button,a{font:inherit}a{text-decoration:none;color:inherit}.demo-note{padding:10px 24px;text-align:center;background:#f0d9ba;font-size:13px}.section{padding:92px max(24px,calc((100vw - 1440px)/2));background:var(--ink);color:#fff}.intro{display:grid;grid-template-columns:1.3fr .65fr;gap:56px;align-items:end;margin:0 auto 72px;max-width:1170px}.eyebrow{margin:0 0 18px;color:var(--cyan);font-size:14px;font-weight:700;letter-spacing:.09em}.intro h1{margin:0;font-size:clamp(42px,5vw,72px);line-height:1.06;letter-spacing:-.06em}.intro p{margin:0;color:#c6d2d8;font-size:18px;line-height:1.75}.showcase{display:grid;grid-template-columns:1.22fr .9fr;gap:76px;max-width:1170px;margin:auto;align-items:start}.visual{min-height:560px;border:1px solid #365669;background:#09202b;padding:30px;position:relative;overflow:hidden}.screen-top{display:flex;justify-content:space-between;color:#a7dff3;font-size:13px;font-weight:bold;margin-bottom:22px}.scene-visual{height:440px;background:linear-gradient(140deg,#e7eef0,#a7bbc7);color:var(--ink);padding:25px;position:relative;transition:.25s}.scene-visual:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 9%,rgba(110,216,252,.35),transparent 30%),linear-gradient(100deg,transparent 50%,rgba(23,106,148,.16));pointer-events:none}.ui-title{position:relative;margin:0 0 24px;font-size:25px}.columns{position:relative;display:grid;grid-template-columns:170px 1fr;gap:18px;height:340px}.sidebar,.main-ui{background:#fff;border-radius:8px;padding:17px;box-shadow:0 7px 18px #3950642b}.sidebar b,.bar{display:block;padding:9px;background:#dceef4;border-radius:5px;margin-bottom:9px;font-size:12px}.bar{height:38px}.blocks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.blocks i{height:105px;background:linear-gradient(145deg,#eff5f5,#a9d7e7);border-radius:6px}.details{border-top:1px solid #38515e}.scene{display:block;width:100%;text-align:left;border:0;border-top:1px solid #38515e;background:transparent;color:#fff;padding:27px 18px 27px 44px;position:relative;cursor:pointer}.scene:before{content:attr(data-no);position:absolute;left:0;top:30px;color:var(--cyan);font-weight:bold}.scene:hover,.scene.active{background:#253945;box-shadow:inset 4px 0 var(--cyan)}.scene h2{font-size:25px;margin:0 0 10px}.scene p{color:#b7c4ca;line-height:1.65;margin:0 0 14px}.tags{display:flex;gap:8px;flex-wrap:wrap}.tags span{font-size:12px;border:1px solid #4a626e;padding:5px 9px;border-radius:18px;color:#c6d6dd}.arrow{color:var(--cyan);float:right;font-size:22px}.more{max-width:1170px;margin:52px auto 0;border:1px solid #426171;padding:22px 27px;display:flex;justify-content:space-between;align-items:center;color:#fff;cursor:pointer;background:transparent;width:100%;text-align:left}.more:hover{border-color:var(--cyan);color:var(--cyan)}.catalog{display:none;padding:82px max(24px,calc((100vw - 1180px)/2));background:var(--paper)}.catalog.show{display:block}.catalog h2,.detail h2{font-size:40px;margin:0 0 16px}.catalog>p{color:#53636c;max-width:620px;line-height:1.7}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:32px 0}.filter{border:1px solid #b6c2c6;background:transparent;border-radius:20px;padding:8px 14px;cursor:pointer}.filter.active,.filter:hover{background:var(--ink);color:white}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.card{background:#fff;border:1px solid #d5dedf;padding:25px;min-height:200px;cursor:pointer;display:flex;flex-direction:column}.card:hover{border-color:#275b71;transform:translateY(-2px)}.card small{color:var(--red);font-weight:bold}.card h3{font-size:23px;margin:18px 0 10px}.card p{color:#5a686f;line-height:1.6;margin:0}.card b{margin-top:auto;padding-top:18px;color:#176c8f}.detail{display:none;max-width:1170px;margin:auto;padding:70px 24px 100px}.detail.show{display:block}.back{border:0;background:none;color:#176c8f;padding:0;cursor:pointer;margin-bottom:42px}.detail-hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;margin-bottom:44px}.photo{min-height:340px;background:linear-gradient(135deg,#1b3340,#7ec9e3);position:relative;overflow:hidden}.photo:after{content:"AI";position:absolute;right:28px;bottom:-20px;font-size:160px;font-weight:bold;color:#ffffff33}.detail .lead{font-size:19px;line-height:1.7;color:#52626a}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:32px 0}.flow article,.outputs{border:1px solid #d6dedf;padding:24px;background:#fff}.flow h3{color:var(--red);margin-top:0}.flow p{line-height:1.7;color:#55636a}.outputs{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.outputs b{margin-right:10px}.outputs span{border:1px solid #8ca6af;border-radius:18px;padding:8px 12px}.contact{background:#173543;color:#fff;padding:42px;margin-top:34px;display:flex;justify-content:space-between;align-items:center;gap:20px}.contact h3{margin:0 0 7px;font-size:25px}.contact p{margin:0;color:#c8d8de}.cta{display:inline-block;background:var(--cyan);color:#0f2631;border:0;padding:14px 20px;font-weight:bold;cursor:pointer;white-space:nowrap}.contact-form{display:none;margin-top:24px;border:1px solid #6690a0;padding:22px;background:#fff;color:#10212c}.contact-form.show{display:block}.contact-form label{display:block;margin-bottom:12px;font-weight:bold}.contact-form input,.contact-form textarea{width:100%;margin-top:7px;padding:10px;border:1px solid #aab8be}.contact-form textarea{min-height:80px}@media(max-width:760px){.section{padding:58px 20px}.intro,.showcase,.detail-hero{grid-template-columns:1fr;gap:30px}.intro{margin-bottom:42px}.visual{min-height:auto;padding:18px}.scene-visual{height:320px;padding:16px}.columns{grid-template-columns:100px 1fr;height:220px}.sidebar,.main-ui{padding:10px}.blocks i{height:65px}.showcase{gap:30px}.cards,.flow{grid-template-columns:1fr}.more{margin-top:30px}.catalog{padding:58px 20px}.detail{padding:45px 20px 75px}.contact{display:block}.contact .cta{margin-top:20px}.intro h1{font-size:45px}.scene h2{font-size:21px}}
  </style>
</head>
<body>
  <div class="demo-note">EVOL DREAM「业务场景模块」方向 Demo · 仅用于确认信息架构与视觉，不代表已上线服务或客户案例</div>
  <main id="home">
    <section class="section">
      <div class="intro"><div><p class="eyebrow">03 / BUSINESS SCENARIOS</p><h1>业务场景与<br>解决方案</h1></div><p>从真实、高频、可复核的工作任务开始。以业务资料、人员判断与现有流程为基础，设计适合试点的 AI 应用。</p></div>
      <div class="showcase"><div class="visual"><div class="screen-top"><span>场景应用示意 / <span id="visualNo">01</span></span><span id="visualLabel">知识与协同</span></div><div class="scene-visual"><h2 class="ui-title" id="uiTitle">企业知识助手工作台</h2><div class="columns"><div class="sidebar"><b>知识库</b><b>资料更新</b><b>常见问题</b><b>使用记录</b></div><div class="main-ui"><div class="bar"></div><div class="bar"></div><div class="blocks"><i></i><i></i><i></i></div></div></div></div></div><div class="details" id="details"></div></div>
      <button class="more" id="more"><span><b>查看更多业务场景</b><br><small>按部门与业务任务浏览完整场景库</small></span><span>↗</span></button>
    </section>
  </main>
  <section class="catalog" id="catalog"><p class="eyebrow">ALL BUSINESS SCENARIOS</p><h2>从具体工作任务开始</h2><p>首页只展示优先讨论的三个场景；这里收录全部场景，后续可按照 PDF 中的业务内容持续扩展。</p><div class="filters" id="filters"><button class="filter active" data-cat="all">全部</button><button class="filter" data-cat="协同">知识与协同</button><button class="filter" data-cat="客户">客户与销售</button><button class="filter" data-cat="供应链">采购与供应链</button><button class="filter" data-cat="组织">组织与人才</button></div><div class="cards" id="cards"></div></section>
  <section class="detail" id="detail"></section>
  <script>
    const scenes=[
      {id:'knowledge',no:'01',cat:'协同',label:'知识与协同',name:'企业知识问答',short:'让员工快速找到制度、产品资料与操作流程，并回到原始资料复核。',tags:['知识检索','来源引用','权限范围','资料维护'],ui:'企业知识助手工作台',pain:'资料分散在文档、群聊与人员经验中，重复查询占用业务时间。',how:'将已授权资料整理为可查询知识来源，回答时保留引用和资料不足提示。',role:'知识负责人维护资料范围；业务人员核对关键结论与原始来源。',outputs:['带来源的问答结果','待补充知识清单','使用问题记录']},
      {id:'service',no:'02',cat:'客户',label:'客户与销售',name:'客户服务与订单协同',short:'整理询盘、订单信息与常见问题，辅助客服准备可复核的响应。',tags:['询盘归类','订单查询','回复草稿','人工确认'],ui:'客户服务协同工作台',pain:'客户问题、产品资料与订单状态来自多个渠道，查找和交接耗时。',how:'汇总授权范围内的客户与订单资料，生成问题分类、信息摘要和回复草稿。',role:'客服确认客户身份、订单状态与对外回复；AI 不替代承诺或异常决策。',outputs:['客户问题摘要','待跟进事项清单','回复草稿']},
      {id:'procurement',no:'03',cat:'供应链',label:'采购与供应链',name:'AI 辅助采购与供应商比对',short:'将报价、规格、交期与采购条件整理为统一、可追溯的比对依据。',tags:['报价提取','规格对齐','差异标记','人工决策'],ui:'采购方案比对工作台',pain:'供应商文件格式不一，人工反复整理参数、交期和价格，难以及时对照。',how:'提取材料中的关键字段，按既定采购规则对齐并标出缺失、差异和待确认项。',role:'采购人员确认数据来源、议价策略及最终供应商选择；AI 只辅助信息整理。',outputs:['供应商信息表','采购方案对比表','待确认事项清单']},
      {id:'recruitment',no:'04',cat:'组织',label:'组织与人才',name:'招聘流程辅助',short:'把岗位要求与候选资料结构化，帮助招聘人员准备匹配说明与沟通重点。',tags:['简历整理','岗位匹配','沟通准备','人工审核'],ui:'招聘流程辅助工作台',pain:'简历、岗位说明和沟通记录分散，重复整理工作影响招聘节奏。',how:'在授权范围内抽取候选资料，按岗位规则生成结构化摘要与待核验重点。',role:'招聘人员决定联系、面试与录用，避免把自动评分当作最终判断。',outputs:['候选资料摘要','岗位对照说明','沟通准备清单']},
      {id:'content',no:'05',cat:'客户',label:'客户与销售',name:'内容创作支持',short:'基于产品资料、品牌语气和受众，辅助准备内容主题、文案初稿与脚本。',tags:['主题规划','文案初稿','脚本准备','品牌审核'],ui:'品牌内容协同工作台',pain:'内容团队从零起稿频繁，资料复用与品牌一致性难以兼顾。',how:'结合已授权的资料与品牌规范，辅助组织选题、初稿和发布前检查项。',role:'内容负责人审核事实、品牌表达、素材授权与最终发布。',outputs:['内容主题清单','图文文案初稿','发布检查清单']}
    ];
    let active=scenes[0];const details=document.querySelector('#details'),uiTitle=document.querySelector('#uiTitle');
    function renderHome(){details.innerHTML=scenes.slice(0,3).map(s=>`<button class="scene ${s.id===active.id?'active':''}" data-id="${s.id}" data-no="${s.no}"><h2>${s.name}<span class="arrow">→</span></h2><p>${s.short}</p><div class="tags">${s.tags.map(t=>`<span>${t}</span>`).join('')}</div></button>`).join('');details.querySelectorAll('.scene').forEach(b=>{b.onmouseenter=()=>select(b.dataset.id);b.onclick=()=>showDetail(b.dataset.id)});document.querySelector('#visualNo').textContent=active.no;document.querySelector('#visualLabel').textContent=active.label;uiTitle.textContent=active.ui}
    function select(id){active=scenes.find(s=>s.id===id);renderHome()}
    function renderCards(cat='all'){document.querySelector('#cards').innerHTML=scenes.filter(s=>cat==='all'||s.cat===cat).map(s=>`<article class="card" data-id="${s.id}"><small>${s.no} / ${s.label}</small><h3>${s.name}</h3><p>${s.short}</p><b>查看场景说明 →</b></article>`).join('');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>showDetail(c.dataset.id))}
    function showCatalog(){document.querySelector('#catalog').classList.add('show');document.querySelector('#detail').classList.remove('show');renderCards();document.querySelector('#catalog').scrollIntoView({behavior:'smooth'})}
    function showDetail(id){const s=scenes.find(x=>x.id===id);document.querySelector('#catalog').classList.remove('show');const d=document.querySelector('#detail');d.innerHTML=`<button class="back" id="back">← 返回全部业务场景</button><div class="detail-hero"><div><p class="eyebrow">业务场景 ${s.no} / ${s.label}</p><h2>${s.name}</h2><p class="lead">${s.short}</p></div><div class="photo" aria-label="${s.name}工作界面示意"></div></div><div class="flow"><article><h3>业务难题</h3><p>${s.pain}</p></article><article><h3>AI 如何参与</h3><p>${s.how}</p></article><article><h3>人员保留职责</h3><p>${s.role}</p></article></div><div class="outputs"><b>可形成的工作产物</b>${s.outputs.map(x=>`<span>${x}</span>`).join('')}</div><div class="contact"><div><h3>讨论相似业务需求</h3><p>先确认资料范围、责任人和人工复核节点，再判断是否适合开展试点。</p></div><button class="cta" id="contactBtn">前往联系我们 →</button></div><form class="contact-form" id="form"><label>公司名称<input placeholder="请输入公司或机构名称"></label><label>希望讨论的业务问题<textarea placeholder="例如：希望讨论 ${s.name} 场景"></textarea></label><button type="button" class="cta">提交咨询（Demo）</button></form>`;d.classList.add('show');d.scrollIntoView({behavior:'smooth'});document.querySelector('#back').onclick=showCatalog;document.querySelector('#contactBtn').onclick=()=>document.querySelector('#form').classList.add('show')}
    document.querySelector('#more').onclick=showCatalog;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderCards(b.dataset.cat)});renderHome();
  </script>
</body>
</html>
